<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Katana · Livesets</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel2: #181c26;
    --line: #2a3140;
    --text: #eef1f6;
    --muted: #8b95a8;
    --accent: #3dd6ff;
    --accent-dim: rgba(61,214,255,.12);
    --ok: #3dd68c;
    --warn: #f5a524;
    --bad: #ff5c7a;
    --card-hover: #1e2430;
    --radius: 14px;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
  }

  /* ===== widescreen shell: 100vh single screen ===== */
  .app {
    height: 100vh;
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    grid-template-rows: 64px 1fr 40px;
    gap: 0;
  }
  .top {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #141822, var(--bg));
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: .06em; }
  .brand .sub { color: var(--muted); font-size: .82rem; }
  .top-right { display: flex; align-items: center; gap: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: .8rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .dot.on { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.off { background: var(--bad); }
  button {
    font: inherit; cursor: pointer;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: linear-gradient(135deg, #1a6f8c, #1490a8);
    border-color: transparent; color: #fff;
  }
  button:disabled { opacity: .45; cursor: default; }

  /* left rail — filters / liveset groups */
  .rail {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .rail-head { padding: 14px 14px 8px; }
  .search {
    width: 100%;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text);
    padding: 10px 12px; font: inherit;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .rail-scroll { flex: 1; overflow: auto; padding: 8px 10px 16px; }
  .group-label {
    color: var(--muted); font-size: .7rem; text-transform: uppercase;
    letter-spacing: .1em; margin: 14px 6px 6px;
  }
  .chip {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left; margin-bottom: 4px;
    background: transparent; border: 1px solid transparent;
    padding: 9px 10px; border-radius: 10px; color: var(--text);
  }
  .chip:hover { background: var(--card-hover); }
  .chip.active {
    background: var(--accent-dim);
    border-color: rgba(61,214,255,.35);
    color: var(--accent);
  }
  .chip .count {
    color: var(--muted); font-size: .75rem;
    background: var(--bg); border-radius: 999px; padding: 2px 8px;
  }
  .chip.active .count { color: var(--accent); }

  /* main — preset browser */
  .main {
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
    background: var(--bg);
  }
  .main-head {
    padding: 12px 18px 8px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .main-head h2 { margin: 0; font-size: .95rem; font-weight: 600; }
  .main-head .hint { color: var(--muted); font-size: .8rem; }
  .grid {
    flex: 1; overflow: auto;
    padding: 8px 16px 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    align-content: start;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: border-color .12s, transform .12s, background .12s;
    min-height: 118px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card:hover { border-color: #3d4a60; background: var(--card-hover); }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(61,214,255,.25), 0 8px 28px rgba(0,0,0,.35);
    background: linear-gradient(160deg, rgba(61,214,255,.08), var(--panel));
  }
  .card.live {
    border-color: rgba(61,214,140,.55);
  }
  .card.live .name::after {
    content: " · no amp";
    color: var(--ok);
    font-size: .75rem;
    font-weight: 500;
  }
  .card.live-ready { border-color: rgba(61,214,140,.48); }
  .tag.live-slot {
    color: var(--ok); border-color: rgba(61,214,140,.55);
    background: rgba(61,214,140,.07); font-weight: 650;
  }
  .card.loading { opacity: .55; pointer-events: none; }
  .card.loading::after {
    content: "…";
    color: var(--accent);
  }
  .card .name { font-size: 1.05rem; font-weight: 650; line-height: 1.25; }
  .card .song { color: var(--text); font-size: .88rem; opacity: .9; }
  .card .meta {
    margin-top: auto;
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-top: 8px;
  }
  .tag {
    font-size: .72rem; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 8px;
  }
  .tag.tuning { color: #c9b6ff; border-color: #4a3f6b; }
  .tag.amp { color: #ffc28a; border-color: #5a4030; }
  .empty {
    grid-column: 1 / -1;
    color: var(--muted); text-align: center; padding: 48px 20px;
  }

  /* right — now playing / quick controls */
  .side {
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column;
    min-height: 0; padding: 16px;
    gap: 14px;
  }
  .np-label {
    color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em;
  }
  .np-name { font-size: 1.35rem; font-weight: 700; line-height: 1.2; margin-top: 4px; }
  .np-song { color: var(--muted); font-size: .9rem; margin-top: 4px; min-height: 1.2em; }
  .np-notes {
    color: var(--muted); font-size: .8rem; line-height: 1.4;
    max-height: 4.2em; overflow: hidden;
  }
  .control-block {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  .vol-row { display: flex; align-items: baseline; justify-content: space-between; }
  .vol-val {
    font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--accent); line-height: 1;
  }
  .vol-keys { color: var(--muted); font-size: .75rem; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 999px;
    background: #2a3344; outline: none; margin-top: 12px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent);
    cursor: pointer;
  }
  .pitch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 4px;
  }
  .pitch-val {
    font-size: 1.6rem; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums; min-width: 3ch; text-align: center;
  }
  .pitch-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .pitch-btns button { padding: 6px 10px; font-size: .82rem; }
  .amp-mini { display: grid; gap: 8px; margin-top: 4px; }
  .amp-mini .slabel {
    display: flex; justify-content: space-between;
    font-size: .78rem; color: var(--muted);
  }
  .err {
    color: var(--bad); font-size: .8rem; white-space: pre-wrap;
    min-height: 1em;
  }
  .msg { color: var(--ok); font-size: .8rem; min-height: 1.1em; }

  /* footer shortcuts */
  .foot {
    grid-column: 1 / -1;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 18px;
    padding: 0 18px;
    color: var(--muted); font-size: .78rem;
    background: #0e1118;
  }
  .foot kbd {
    display: inline-block;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: .72rem;
    color: var(--text);
    background: var(--panel2);
  }
  .foot .sep { opacity: .35; }

  /* focus ring for keyboard nav on cards */
  .card:focus { outline: none; }
  .card:focus-visible { border-color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>KATANA</h1>
      <span class="sub" id="patchLine">livesets · BT-DUAL</span>
    </div>
    <div class="top-right">
      <div class="badge"><span class="dot" id="dot"></span><span id="conn">…</span></div>
      <button class="primary" id="btnConnect" onclick="connect()">Conectar</button>
      <button id="btnLive" onclick="prepareLive()">Preparar Live</button>
      <button onclick="refresh()">Atualizar</button>
    </div>
  </header>

  <aside class="rail">
    <div class="rail-head">
      <input class="search" id="q" type="search" placeholder="Buscar artista, música, tom…"
             autocomplete="off" spellcheck="false"/>
    </div>
    <div class="rail-scroll" id="rail"></div>
  </aside>

  <main class="main">
    <div class="main-head">
      <h2 id="mainTitle">Todos os presets</h2>
      <div class="hint" id="mainCount"></div>
    </div>
    <div class="grid" id="grid" tabindex="0"></div>
  </main>

  <aside class="side">
    <div>
      <div class="np-label">Agora no amp</div>
      <div class="np-name" id="npName">—</div>
      <div class="np-song" id="npSong"></div>
      <div class="np-notes" id="npNotes"></div>
    </div>

    <div class="control-block">
      <div class="vol-row">
        <div>
          <div class="np-label">Volume</div>
          <div class="vol-keys"><kbd>↑</kbd> <kbd>↓</kbd> ±2 · Shift ±5</div>
        </div>
        <div class="vol-val" id="volVal">—</div>
      </div>
      <input id="vol" type="range" min="0" max="100" value="40"
             oninput="onVolInput(this.value)" onchange="setVol(+this.value)"/>
    </div>

    <div class="control-block">
      <div class="np-label">Tom (pitch)</div>
      <div class="pitch-row">
        <button onclick="nudgePitch(-1)">−</button>
        <div class="pitch-val" id="pval">0</div>
        <button onclick="nudgePitch(1)">+</button>
      </div>
      <div class="np-song" id="pnote" style="text-align:center;margin-top:4px">E → E</div>
      <input id="pitch" type="range" min="-12" max="12" step="1" value="0"
             oninput="onSlide(this.value)" onchange="commitPitch(this.value)"/>
      <div class="pitch-btns">
        <button onclick="setPitch(-4)">−4</button>
        <button onclick="setPitch(-1)">−1 Eb</button>
        <button onclick="setPitch(0)">0</button>
        <button onclick="setPitch(1)">+1</button>
      </div>
    </div>

    <div class="control-block" style="flex:1;min-height:0;overflow:auto">
      <div class="np-label">EQ rápido</div>
      <div class="amp-mini" id="ampMini"></div>
    </div>

    <div class="msg" id="msg"></div>
    <div class="err" id="err"></div>
  </aside>

  <footer class="foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> volume</span>
    <span class="sep">·</span>
    <span><kbd>←</kbd><kbd>→</kbd> trocar preset</span>
    <span class="sep">·</span>
    <span>clique = carregar</span>
    <span class="sep">·</span>
    <span><kbd>/</kbd> buscar</span>
    <span class="sep">·</span>
    <span><kbd>[</kbd><kbd>]</kbd> tom ±1</span>
    <span style="margin-left:auto" id="footStatus"></span>
  </footer>
</div>

<script>
const NOTE = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const AMP_TYPES = ['acoustic','clean','pushed','crunch','lead','brown'];

let presets = [];       // full list from API
let filtered = [];      // after filter
let selectedId = null;  // highlighted in grid
let activeFilter = { type: 'all', value: null };
let current = { name: '', volume: 40, pitch: 0, amp: null, presetId: null };
let volTimer = null;
let pitchTimer = null;
let pitchInflight = false;
let pitchQueued = null;
let saveTimer = null;
let bleGen = 0;              // invalidates stale controls when preset changes
let bleTail = Promise.resolve();
let liveSlots = new Map();   // preset id -> internal slot 0..9
let livePreparing = false;

function bleEnqueue(fn) {
  const p = bleTail.then(fn, fn);
  bleTail = p.catch(() => {});
  return p;
}

function invalidateControlsForLoad() {
  bleGen++;
  clearTimeout(volTimer);
  clearTimeout(pitchTimer);
  clearTimeout(saveTimer);
  volQueued = null;
  pitchQueued = null;
  for (const k of Object.keys(ampTimers)) clearTimeout(ampTimers[k]);
  for (const k of Object.keys(ampQueued)) delete ampQueued[k];
  return bleGen;
}

function schedulePresetSave(reason) {
  if (!current.presetId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => persistPreset(reason), 450);
}

async function persistPreset(reason) {
  if (!current.presetId) return;
  const presetId = current.presetId;
  const gen = bleGen;
  const amp = { ...(current.amp || {}) };
  // live slider values win
  amp.volume = current.volume;
  if (document.getElementById('av_gain')) amp.gain = +document.getElementById('av_gain').textContent;
  if (document.getElementById('av_bass')) amp.bass = +document.getElementById('av_bass').textContent;
  if (document.getElementById('av_middle')) amp.middle = +document.getElementById('av_middle').textContent;
  if (document.getElementById('av_treble')) amp.treble = +document.getElementById('av_treble').textContent;
  if (document.getElementById('av_presence')) amp.presence = +document.getElementById('av_presence').textContent;
  // strip non-serializable
  const cleanAmp = {};
  for (const [k, v] of Object.entries(amp)) {
    if (v === undefined || v === null || k === 'raw') continue;
    cleanAmp[k] = typeof v === 'number' ? v : v;
  }
  try {
    if (gen !== bleGen || presetId !== current.presetId) return;
    const j = await apiJSON('/api/presets/' + encodeURIComponent(presetId), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        amp: cleanAmp,
        pitch_semitones: current.pitch,
      }),
    });
    // keep library list in sync only if still on same preset
    if (gen !== bleGen || presetId !== current.presetId) return;
    const p = presets.find(x => x.id === presetId);
    if (p) {
      p.amp = { ...(p.amp || {}), ...cleanAmp };
      p.hay = [p.name, p.song, p.tuning, p.notes, p.id, p.artist, p.ampName].join(' ').toLowerCase();
    }
    const label = reason || 'preset';
    liveSlots.delete(presetId); // edited JSON no longer matches the prepared slot hash
    renderGrid();
    updateLiveButton();
    document.getElementById('msg').textContent = `salvo · ${label} · prepare Live novamente`;
  } catch (e) {
    document.getElementById('err').textContent = 'salvar preset: ' + (e.message || e);
  }
}

function openTo(semi) {
  return NOTE[(4 + (+semi) + 120) % 12];
}
function fmtPitch(v) {
  v = +v;
  return (v > 0 ? '+' : '') + v;
}
function onSlide(v) {
  document.getElementById('pval').textContent = fmtPitch(v);
  document.getElementById('pnote').textContent = `E → ${openTo(v)}`;
}
function fmtErr(j) {
  if (!j) return 'erro';
  if (typeof j.detail === 'string') return j.detail;
  if (Array.isArray(j.detail)) return j.detail.map(x => x.msg || JSON.stringify(x)).join('; ');
  return j.error || JSON.stringify(j);
}

/** fetch JSON with silent retry on 503 (BLE busy) */
async function apiJSON(url, opts = {}, { retries = 6 } = {}) {
  let lastErr;
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch(url, opts);
      const j = await r.json().catch(() => ({}));
      if (r.status === 503) {
        lastErr = new Error(fmtErr(j) || 'ocupado');
        await new Promise(res => setTimeout(res, 120 + i * 80));
        continue;
      }
      if (!r.ok) throw new Error(fmtErr(j) || r.statusText);
      return j;
    } catch (e) {
      lastErr = e;
      // network blip
      if (i + 1 < retries && !(e.message || '').includes('ocupado')) {
        await new Promise(res => setTimeout(res, 80));
        continue;
      }
      throw e;
    }
  }
  throw lastErr || new Error('falha de rede');
}
function setConn(on, err) {
  document.getElementById('dot').className = 'dot ' + (on ? 'on' : 'off');
  document.getElementById('conn').textContent = on ? 'conectado' : 'desconectado';
  if (err) document.getElementById('err').textContent = err;
  else if (on) document.getElementById('err').textContent = '';
}
function parseArtist(song) {
  if (!song) return 'Outros';
  const parts = song.split(' - ');
  if (parts.length >= 2) return parts[0].replace(/—/g, '-').trim();
  const parts2 = song.split(' — ');
  if (parts2.length >= 2) return parts2[0].trim();
  return 'Outros';
}
function ampLabel(p) {
  const a = p.amp || {};
  if (a.type_name) return a.type_name;
  if (typeof a.type === 'number' && AMP_TYPES[a.type]) return AMP_TYPES[a.type];
  return null;
}
function enrich(p) {
  const artist = parseArtist(p.song || '');
  const tuning = p.tuning || '';
  const amp = ampLabel(p);
  const hay = [p.name, p.song, p.tuning, p.notes, p.id, artist, amp].join(' ').toLowerCase();
  return { ...p, artist, ampName: amp, hay };
}

async function loadPresets() {
  const r = await fetch('/api/presets');
  const list = await r.json();
  // hide noisy backups from primary browser (still searchable as "backup")
  presets = list.map(enrich);
  buildRail();
  applyFilter();
}

async function loadLiveStatus() {
  try {
    const j = await apiJSON('/api/live', {}, { retries: 2 });
    liveSlots = new Map((j.slots || []).map(x => [x.id, x.slot]));
  } catch (e) {
    liveSlots = new Map();
  }
  renderGrid();
  updateLiveButton();
}

function updateLiveButton() {
  const btn = document.getElementById('btnLive');
  if (!btn) return;
  const n = filtered.length;
  const ready = filtered.filter(p => liveSlots.has(p.id)).length;
  btn.disabled = livePreparing || n < 1 || n > 10;
  btn.textContent = livePreparing ? 'Preparando Live…'
    : n > 10 ? 'Filtre até 10 presets'
    : ready === n && n ? `Live pronto · ${n}`
    : `Preparar Live · ${n}`;
}

async function prepareLive() {
  if (livePreparing) return;
  const ids = filtered.map(p => p.id);
  if (!ids.length || ids.length > 10) {
    document.getElementById('err').textContent = 'Use os filtros ou a busca para deixar entre 1 e 10 presets.';
    return;
  }
  const names = filtered.map((p, i) => `${i + 1}. ${p.name}`).join('\n');
  if (!confirm(`Preparar ${ids.length} presets para troca atômica?\n\nIsso sobrescreve os slots internos correspondentes do Katana:\n\n${names}`)) return;
  livePreparing = true;
  updateLiveButton();
  document.getElementById('err').textContent = '';
  document.getElementById('msg').textContent = `preparando ${ids.length} slots · não toque nos controles…`;
  try {
    const j = await bleEnqueue(() => apiJSON('/api/live/prepare', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ preset_ids: ids })
    }, { retries: 2 }));
    liveSlots = new Map((j.slots || []).map(x => [x.id, x.slot]));
    renderGrid();
    document.getElementById('msg').textContent = `Live pronto · ${j.prepared} slots verificados`;
    if (j.active) await loadPreset(j.active);
  } catch (e) {
    document.getElementById('err').textContent = `preparar Live: ${e.message || e}`;
  } finally {
    livePreparing = false;
    updateLiveButton();
  }
}

function buildRail() {
  const artists = {};
  const tunings = {};
  const amps = {};
  for (const p of presets) {
    artists[p.artist] = (artists[p.artist] || 0) + 1;
    const t = p.tuning || '—';
    tunings[t] = (tunings[t] || 0) + 1;
    if (p.ampName) amps[p.ampName] = (amps[p.ampName] || 0) + 1;
  }
  const rail = document.getElementById('rail');
  const mk = (type, value, label, count) => {
    const active = activeFilter.type === type && activeFilter.value === value;
    return `<button class="chip ${active ? 'active' : ''}"
      onclick="setFilter('${type}', ${JSON.stringify(value)})">
      <span>${label}</span><span class="count">${count}</span></button>`;
  };
  let html = mk('all', null, 'Todos', presets.length);
  html += `<div class="group-label">Artista / banda</div>`;
  Object.keys(artists).sort((a,b) => artists[b]-artists[a] || a.localeCompare(b))
    .forEach(a => { html += mk('artist', a, a, artists[a]); });
  html += `<div class="group-label">Afinação / pitch</div>`;
  Object.keys(tunings).sort().forEach(t => { html += mk('tuning', t, t, tunings[t]); });
  html += `<div class="group-label">Amp</div>`;
  Object.keys(amps).sort().forEach(a => { html += mk('amp', a, a, amps[a]); });
  rail.innerHTML = html;
}

function setFilter(type, value) {
  activeFilter = { type, value };
  buildRail();
  applyFilter();
}

function applyFilter() {
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  filtered = presets.filter(p => {
    if (activeFilter.type === 'artist' && p.artist !== activeFilter.value) return false;
    if (activeFilter.type === 'tuning' && (p.tuning || '—') !== activeFilter.value) return false;
    if (activeFilter.type === 'amp' && p.ampName !== activeFilter.value) return false;
    if (q && !p.hay.includes(q)) return false;
    return true;
  });
  // prefer "song" presets first, backups last
  filtered.sort((a, b) => {
    const ab = /backup|from-phone/i.test(a.id) ? 1 : 0;
    const bb = /backup|from-phone/i.test(b.id) ? 1 : 0;
    if (ab !== bb) return ab - bb;
    return (a.song || a.name).localeCompare(b.song || b.name);
  });
  if (selectedId && !filtered.some(p => p.id === selectedId)) {
    selectedId = filtered[0]?.id || null;
  }
  if (!selectedId && filtered[0]) selectedId = filtered[0].id;
  renderGrid();
  const title = activeFilter.type === 'all' ? 'Todos os presets'
    : activeFilter.type === 'artist' ? activeFilter.value
    : activeFilter.type === 'tuning' ? `Afinação: ${activeFilter.value}`
    : `Amp: ${activeFilter.value}`;
  document.getElementById('mainTitle').textContent = title;
  document.getElementById('mainCount').textContent = `${filtered.length} preset${filtered.length===1?'':'s'}`;
  updateLiveButton();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">Nenhum preset neste filtro.</div>`;
    return;
  }
  grid.innerHTML = filtered.map(p => {
    const sel = p.id === selectedId ? 'selected' : '';
    const live = p.id === current.presetId || p.name === current.name ? ' live' : '';
    const liveSlot = liveSlots.has(p.id) ? liveSlots.get(p.id) : null;
    const ready = liveSlot !== null ? ' live-ready' : '';
    const tags = [];
    if (liveSlot !== null) tags.push(`<span class="tag live-slot">LIVE · ${liveSlot + 1}</span>`);
    if (p.tuning) tags.push(`<span class="tag tuning">${esc(p.tuning)}</span>`);
    if (p.ampName) tags.push(`<span class="tag amp">${esc(p.ampName)}</span>`);
    if (p.artist && p.artist !== 'Outros') tags.push(`<span class="tag">${esc(p.artist)}</span>`);
    return `<div class="card ${sel}${live}${ready}" data-id="${escAttr(p.id)}" tabindex="-1">
      <div class="name">${esc(p.name)}</div>
      <div class="song">${esc(p.song || p.notes || p.id)}</div>
      <div class="meta">${tags.join('')}</div>
    </div>`;
  }).join('');
}

// event delegation — avoids broken inline handlers with special ids
document.getElementById('grid').addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card) return;
  const id = card.getAttribute('data-id');
  if (!id) return;
  selectPreset(id);
  loadPreset(id); // single click loads
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escAttr(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;');
}

function selectPreset(id) {
  selectedId = id;
  renderGrid();
  const p = presets.find(x => x.id === id);
  if (p) {
    document.getElementById('footStatus').textContent =
      `selecionado: ${p.name}` + (p.song ? ` · ${p.song}` : '');
  }
  const el = document.querySelector(`.card.selected`);
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function showNowPlayingPreview(p) {
  document.getElementById('footStatus').textContent =
    `selecionado: ${p.name}` + (p.song ? ` · ${p.song}` : '');
}

function selectedIndex() {
  return filtered.findIndex(p => p.id === selectedId);
}
function moveSelection(delta, { load = true } = {}) {
  if (!filtered.length) return;
  let i = selectedIndex();
  if (i < 0) i = 0;
  else i = (i + delta + filtered.length) % filtered.length;
  selectPreset(filtered[i].id);
  if (load) loadPreset(filtered[i].id);
}

let loadInflight = false;
let loadQueued = null;
async function loadPreset(id, existingGen = null) {
  if (!id) return;
  const requestedGen = existingGen ?? invalidateControlsForLoad();
  if (loadInflight) {
    loadQueued = { id, gen: requestedGen };
    return;
  }
  loadInflight = true;
  let next = { id, gen: requestedGen };
  try {
    while (next) {
      const send = next.id;
      const gen = next.gen;
      loadQueued = null;
      const card = document.querySelector(`.card[data-id="${CSS.escape(send)}"]`);
      if (card) card.classList.add('loading');
      document.getElementById('msg').textContent = 'carregando preset…';
      document.getElementById('err').textContent = '';
      const t0 = performance.now();
      try {
        const url = '/api/presets/' + encodeURIComponent(send) + '/load';
        const j = await bleEnqueue(async () => {
          if (gen !== bleGen) return { stale: true };
          return apiJSON(url, { method: 'POST' }, { retries: 2 });
        });
        if (j.stale || gen !== bleGen) {
          next = loadQueued;
          continue;
        }
        const ms = Math.round(performance.now() - t0);
        current.presetId = j.id || send;
        current.name = j.name || send;
        document.getElementById('msg').textContent = j.atomic
          ? `LIVE · slot ${j.live_slot + 1} · ${ms}ms`
          : j.warning
          ? `preset aplicado · sem confirmação · ${ms}ms`
          : `preset ok · ${ms}ms`;
        document.getElementById('npName').textContent = j.name || send;
        const meta = presets.find(p => p.id === send);
        document.getElementById('npSong').textContent = meta?.song || '';
        document.getElementById('npNotes').textContent = meta?.notes || meta?.tuning || '';
        if (j.amp) {
          current.volume = j.amp.volume ?? current.volume;
          document.getElementById('vol').value = current.volume;
          document.getElementById('volVal').textContent = current.volume;
          renderAmp(j.amp);
          current.amp = j.amp;
        }
        if (j.pitch !== undefined && j.pitch !== null) {
          current.pitch = j.pitch;
          document.getElementById('pitch').value = j.pitch;
          onSlide(j.pitch);
        }
        setConn(true);
        selectedId = send;
        renderGrid();
      } catch (e) {
        if (gen === bleGen) document.getElementById('err').textContent = String(e.message || e);
      } finally {
        if (card) card.classList.remove('loading');
      }
      next = loadQueued;
    }
  } finally {
    loadInflight = false;
    // A click can land between the final next check and this finally.
    if (loadQueued) {
      const q = loadQueued;
      loadQueued = null;
      loadPreset(q.id, q.gen);
      return;
    }
    // Apply only the latest controls after the final preset is loaded.
    if (volQueued !== null) {
      const q = volQueued; volQueued = null; setVol(q);
    }
    if (pitchQueued !== null) {
      const q = pitchQueued; pitchQueued = null; setPitch(q);
    }
    for (const field of Object.keys(ampQueued)) {
      const q = ampQueued[field]; delete ampQueued[field]; setAmp(field, q);
    }
  }
}
async function loadSelected() {
  if (selectedId) await loadPreset(selectedId);
}

function onVolInput(v) {
  document.getElementById('volVal').textContent = v;
  clearTimeout(volTimer);
  volTimer = setTimeout(() => setVol(+v), 30);
}
let volInflight = false;
let volQueued = null;
async function setVol(v) {
  v = Math.max(0, Math.min(100, v|0));
  document.getElementById('vol').value = v;
  document.getElementById('volVal').textContent = v;
  current.volume = v;
  if (current.amp) current.amp.volume = v;
  // Controls made while presets are switching belong to the final preset.
  if (loadInflight) { volQueued = v; return; }
  const gen = bleGen;
  if (volInflight) { volQueued = v; return; }
  volInflight = true;
  try {
    while (gen === bleGen) {
      const send = volQueued === null ? v : volQueued;
      volQueued = null;
      const stale = await bleEnqueue(async () => {
        if (gen !== bleGen) return true;
        await apiJSON('/api/amp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ field: 'volume', value: send })
        }, { retries: 2 });
        return false;
      });
      if (stale || gen !== bleGen) break;
      setConn(true);
      document.getElementById('msg').textContent = `vol ${send}`;
      document.getElementById('err').textContent = '';
      schedulePresetSave('volume');
      if (volQueued === null) break;
      v = volQueued;
    }
  } catch (e) {
    if (gen === bleGen) document.getElementById('err').textContent = String(e.message || e);
  } finally {
    volInflight = false;
    if (volQueued !== null) {
      const q = volQueued; volQueued = null; setVol(q);
    }
  }
}
function nudgeVol(delta) {
  setVol((current.volume ?? 40) + delta);
}

function commitPitch(v) {
  clearTimeout(pitchTimer);
  pitchTimer = setTimeout(() => setPitch(+v), 25);
}
function nudgePitch(d) {
  setPitch((current.pitch ?? 0) + d);
}
async function setPitch(v) {
  v = Math.max(-12, Math.min(12, +v));
  document.getElementById('pitch').value = v;
  onSlide(v);
  current.pitch = v;
  // Controls made while presets are switching belong to the final preset.
  if (loadInflight) { pitchQueued = v; return; }
  const gen = bleGen;
  if (pitchInflight) { pitchQueued = v; return; }
  pitchInflight = true;
  try {
    while (gen === bleGen) {
      const send = pitchQueued === null ? v : pitchQueued;
      pitchQueued = null;
      const t0 = performance.now();
      const j = await bleEnqueue(async () => {
        if (gen !== bleGen) return { stale: true };
        return apiJSON('/api/pitch', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ semitones: send })
        }, { retries: 2 });
      });
      if (j.stale || gen !== bleGen) break;
      const ms = Math.round(performance.now() - t0);
      document.getElementById('msg').textContent = `tom ${fmtPitch(j.pitch)} · ${ms}ms`;
      document.getElementById('err').textContent = '';
      setConn(true);
      schedulePresetSave('pitch');
      if (pitchQueued === null) break;
      v = pitchQueued;
    }
  } catch (e) {
    if (gen === bleGen) document.getElementById('err').textContent = String(e.message || e);
  } finally {
    pitchInflight = false;
    if (pitchQueued !== null) {
      const q = pitchQueued; pitchQueued = null; setPitch(q);
    }
  }
}

const AMP_UI = [['gain','Gain'],['bass','Bass'],['middle','Mid'],['treble','Treble'],['presence','Presence']];
function renderAmp(amp) {
  if (!amp) return;
  const root = document.getElementById('ampMini');
  root.innerHTML = '';
  for (const [key, label] of AMP_UI) {
    const val = amp[key] ?? 50;
    const div = document.createElement('div');
    div.innerHTML = `<div class="slabel"><span>${label}</span><span id="av_${key}">${val}</span></div>
      <input type="range" min="0" max="100" value="${val}"
        oninput="document.getElementById('av_${key}').textContent=this.value; queueAmp('${key}', this.value)"/>`;
    root.appendChild(div);
  }
}
const ampTimers = {};
const ampQueued = {};
let ampInflight = {};
function queueAmp(field, value) {
  clearTimeout(ampTimers[field]);
  ampTimers[field] = setTimeout(() => setAmp(field, value), 40);
}
async function setAmp(field, value) {
  value = +value;
  // Controls made while presets are switching belong to the final preset.
  if (loadInflight) { ampQueued[field] = value; return; }
  const gen = bleGen;
  if (ampInflight[field]) {
    ampQueued[field] = value;
    return;
  }
  ampInflight[field] = true;
  try {
    while (gen === bleGen) {
      const send = ampQueued[field] === undefined ? value : ampQueued[field];
      delete ampQueued[field];
      const stale = await bleEnqueue(async () => {
        if (gen !== bleGen) return true;
        await apiJSON('/api/amp', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ field, value: send })
        }, { retries: 2 });
        return false;
      });
      if (stale || gen !== bleGen) break;
      if (!current.amp) current.amp = {};
      current.amp[field] = send;
      if (field === 'volume') current.volume = send;
      setConn(true);
      document.getElementById('err').textContent = '';
      schedulePresetSave(field);
      if (ampQueued[field] === undefined) break;
      value = ampQueued[field];
    }
  } catch (e) {
    if (gen === bleGen) document.getElementById('err').textContent = String(e.message || e);
  } finally {
    ampInflight[field] = false;
    if (ampQueued[field] !== undefined) {
      const q = ampQueued[field]; delete ampQueued[field]; setAmp(field, q);
    }
  }
}

function updateNowPlaying(j) {
  const name = j.name || '—';
  document.getElementById('npName').textContent = name;
  document.getElementById('patchLine').textContent = j.connected ? `no amp · ${name}` : 'desconectado';
  // match library metadata if possible
  const match = presets.find(p => p.name === name) ||
                presets.find(p => p.id === current.presetId);
  document.getElementById('npSong').textContent = match?.song || '';
  document.getElementById('npNotes').textContent = match?.notes || match?.tuning || '';
  if (j.amp) {
    current.volume = j.amp.volume ?? current.volume;
    document.getElementById('vol').value = current.volume;
    document.getElementById('volVal').textContent = current.volume;
    renderAmp(j.amp);
    current.amp = j.amp;
  }
  if (j.pitch !== undefined && j.pitch !== null) {
    current.pitch = j.pitch;
    document.getElementById('pitch').value = j.pitch;
    onSlide(j.pitch);
  }
}

async function refresh() {
  try {
    const r = await fetch('/api/status');
    const j = await r.json();
    setConn(!!j.connected, j.error || '');
    if (j.warning) document.getElementById('msg').textContent = 'conectado · leitura pendente';
    if (j.connected) updateNowPlaying(j);
  } catch (e) {
    setConn(false, String(e));
  }
}
async function connect() {
  document.getElementById('msg').textContent = 'conectando (normal: 2–10s; limite 35s)…';
  document.getElementById('err').textContent = '';
  document.getElementById('btnConnect').disabled = true;
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), 40000);
  try {
    const r = await fetch('/api/connect', { method: 'POST', signal: ac.signal });
    const j = await r.json();
    if (!r.ok) throw new Error(fmtErr(j));
    document.getElementById('msg').textContent = 'conectado';
    await refresh();
  } catch (e) {
    const msg = e.name === 'AbortError'
      ? 'timeout — a tentativa continua no servidor; aguarde e clique Atualizar'
      : String(e.message || e);
    setConn(false, msg);
    document.getElementById('msg').textContent = '';
  } finally {
    clearTimeout(t);
    document.getElementById('btnConnect').disabled = false;
  }
}

// ===== keyboard =====
document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';

  // / focuses search
  if (!typing && e.key === '/') {
    e.preventDefault();
    document.getElementById('q').focus();
    document.getElementById('q').select();
    return;
  }
  if (typing && e.key === 'Escape') {
    e.target.blur();
    return;
  }
  if (typing) return;

  if (e.key === 'ArrowUp') {
    e.preventDefault();
    nudgeVol(e.shiftKey ? 5 : 2);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    nudgeVol(e.shiftKey ? -5 : -2);
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (!e.repeat) moveSelection(-1, { load: true });
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (!e.repeat) moveSelection(1, { load: true });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    loadSelected();
  } else if (e.key === '[') {
    e.preventDefault();
    nudgePitch(-1);
  } else if (e.key === ']') {
    e.preventDefault();
    nudgePitch(1);
  }
});

document.getElementById('q').addEventListener('input', () => applyFilter());

onSlide(0);
loadPresets().then(async () => {
  await loadLiveStatus();
  await refresh();
});
setInterval(refresh, 60000);
</script>
</body>
</html>
